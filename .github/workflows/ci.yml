name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: tools/check-core-purity.sh
      - run: dotnet test core/tests/Harbor.Core.Tests
      - run: dotnet build game/Harbor.csproj
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        id: godot
        with:
          path: ${{ runner.temp }}/harbor-godot
          key: ${{ runner.os }}-x64-godot-4.4.1-web-v1
      - name: Install standard Godot and single-thread Web templates
        if: steps.godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          editor=Godot_v4.4.1-stable_linux.x86_64.zip
          templates=Godot_v4.4.1-stable_export_templates.tpz
          curl --fail --location --retry 3 "$release/$editor" -o "$editor"
          curl --fail --location --retry 3 "$release/$templates" -o "$templates"
          echo "ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  $editor" | sha512sum -c -
          echo "8f461c7d6e91a0fbabfc95b1e4ca70ff1732c6f2920956a16b086ec2a85b5f7e238baf4dbce60dcc5630fae3bcb9a1fa2ae2027b92cb495c02d082705715e441  $templates" | sha512sum -c -
          dest="harbor-godot/data/godot/export_templates/4.4.1.stable"
          mkdir -p "$dest"
          unzip -q "$editor" -d harbor-godot
          unzip -jq "$templates" 'templates/web_nothreads_*.zip' -d "$dest"
          rm "$editor" "$templates"
      - run: dotnet workload install wasm-tools
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GODOT: ${{ runner.temp }}/harbor-godot/Godot_v4.4.1-stable_linux.x86_64
          XDG_DATA_HOME: ${{ runner.temp }}/harbor-godot/data
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-web
          path: web/dist/
          if-no-files-found: error
